{% extends "base.html" %}

{% block title %}Login - DriveBackup{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
    <div class="card form-card" style="max-width:400px; width:100%; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
        <div class="card-body" style="text-align:center; padding:40px 20px;">
            <i class="fas fa-lock" style="font-size:3rem; color:var(--color-primary); margin-bottom:20px;"></i>
            <h2 style="margin-bottom:20px;">Acesso Restrito</h2>
            <p class="text-muted" style="margin-bottom:30px;">Por favor, insira a senha para acessar o painel de administração.</p>
            
            <form method="POST">
                <div class="form-group" style="text-align:left;">
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="Senha do Sistema" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
